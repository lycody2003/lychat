
services:

  # ==========================================
  # FRONTEND
  # ==========================================

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:?VITE_SOCKET_URL is required}

    container_name: frontend
    restart: unless-stopped

    ports:
      - "3002:80"

    depends_on:
      - backend

    networks:
      - lychat_network


  # ==========================================
  # BACKEND
  # ==========================================

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend

    container_name: backend
    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3004}

      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/lychat?authSource=admin

      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

      CLIENT_URL: ${CLIENT_URL:-http://localhost:3002}

    ports:
      - "3004:3004"

    depends_on:
      mongodb:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - lychat_network


  # ==========================================
  # MONGODB
  # ==========================================

  mongodb:
    image: mongo:7

    container_name: lychat_mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok"

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - lychat_network


  # ==========================================
  # REDIS
  # ==========================================

  redis:
    image: redis:7-alpine

    container_name: lychat_redis
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - lychat_network


# ==========================================
# VOLUMES
# ==========================================

volumes:
  mongodb_data:
  redis_data:


# ==========================================
# NETWORKS
# ==========================================

networks:
  lychat_network:
    driver: bridge
